name: Verify NASCAR Tracker

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feature/race-engineering-redesign, feature/race-command-cockpit]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run unit tests
        run: CI=true npm test -- --watchAll=false
      - name: Build production bundle
        run: npm run build
